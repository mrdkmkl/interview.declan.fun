<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>interview.declan.fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #e8e4d9;
    --ink: #1c1a16;
    --red: #a8331f;
    --line: #1c1a16;
    --line-soft: rgba(28,26,22,0.28);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(28,26,22,0.025) 0px, rgba(28,26,22,0.025) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 6vw 6vw 14vw;
  }

  header{
    display: flex;
    align-items: center;
    padding-bottom: 14px;
    border-bottom: 1.5px solid var(--line);
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  .mark{
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: lowercase;
  }

  .row{
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0 22px;
    margin-top: 46px;
  }

  .idx{
    font-size: 11px;
    color: var(--line-soft);
    padding-top: 4px;
    white-space: nowrap;
  }

  .field{
    padding-bottom: 34px;
    border-bottom: 1px dashed var(--line-soft);
    margin-bottom: 34px;
  }

  .field:last-child{
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .field-label{
    font-size: 11px;
    text-transform: lowercase;
    color: var(--line-soft);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .field.reveal{
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.6s ease forwards;
  }

  #countdown{
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow-x: auto;
  }

  #countdown .sep{
    color: var(--line-soft);
    padding: 0 2px;
  }

  #countdown .digit{
    display: inline-block;
    min-width: 1.15ch;
    transition: transform 0.15s ease;
  }

  #countdown .digit.tick{
    animation: flip 0.4s ease;
  }

  @keyframes flip{
    0%{ transform: translateY(-6px); opacity: 0.3; }
    100%{ transform: translateY(0); opacity: 1; }
  }

  .countdown-units{
    display: flex;
    gap: 18px;
    margin-top: 6px;
    font-size: 10px;
    color: var(--line-soft);
    letter-spacing: 0.08em;
    text-transform: lowercase;
  }

  .countdown-units span{ min-width: 3.4ch; }

  .cta{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 20px;
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--ink);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: lowercase;
    position: relative;
    overflow: hidden;
    transition: color 0.35s ease;
  }

  .cta::before{
    content: "";
    position: absolute;
    inset: 0;
    background: var(--ink);
    transform: translateX(-101%);
    transition: transform 0.35s ease;
    z-index: -1;
  }

  .cta:hover{ color: var(--paper); }
  .cta:hover::before{ transform: translateX(0); }

  .cta .arrow{ transition: transform 0.35s ease; }
  .cta:hover .arrow{ transform: translate(3px, -3px); }

  .video-frame{
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1.5px solid var(--line);
    background: var(--ink);
    position: relative;
  }

  .video-frame::before{
    content: "";
    position: absolute;
    top: -6px; left: -6px; right: -6px; bottom: -6px;
    border: 1px solid var(--line-soft);
    pointer-events: none;
  }

  .video-frame iframe{
    width: 100%;
    height: 100%;
    display: block;
    border: none;
  }

  .caption{
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--line-soft);
    letter-spacing: 0.08em;
    text-transform: lowercase;
    margin-top: 10px;
  }

  footer{
    margin-top: 60px;
    padding-top: 14px;
    border-top: 1.5px solid var(--line);
    font-size: 10px;
    color: var(--line-soft);
    letter-spacing: 0.06em;
    text-transform: lowercase;
    display: flex;
    justify-content: space-between;
  }

  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 560px){
    .row{ grid-template-columns: 1fr; gap: 6px; }
    .idx{ padding-top: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
    header, .field{ opacity: 1; transform: none; }
  }

  ::selection{ background: var(--ink); color: var(--paper); }

  a.cta:focus-visible, a:focus-visible{
    outline: 2px solid var(--red);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="mark">interview.declan.fun</div>
  </header>

  <div class="row">
    <div class="idx">01</div>
    <div class="field reveal" id="countdown-field" style="animation-delay:0.1s">
      <div class="field-label">time until launch</div>
      <div id="countdown"></div>
      <div class="countdown-units">
        <span>days</span><span>hours</span><span>min</span><span>sec</span>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="idx">02</div>
    <div class="field reveal" style="animation-delay:0.25s">
      <div class="field-label">apply</div>
      <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLScEKOMRggj_6MoAtUEuZZsMfe4E8m4UtisIuG_ZILwoLb_wbg/viewform?usp=dialog" target="_blank" rel="noopener">
        apply to be interviewed
        <svg class="arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>
      </a>
    </div>
  </div>

  <div class="row">
    <div class="idx">03</div>
    <div class="field reveal" style="animation-delay:0.4s">
      <div class="field-label">the launch video</div>
      <div class="video-frame">
        <iframe src="https://www.youtube.com/embed/1TmYEUdHgdw" title="the launch video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

</div>

<script>
  var target = new Date("2026-08-31T00:00:00");
  var field = document.getElementById("countdown-field");
  var el = document.getElementById("countdown");
  var prev = null;

  function pad(n){ return String(n).padStart(2, "0"); }

  function render(d, h, m, s){
    var vals = [pad(d), pad(h), pad(m), pad(s)];
    var changed = prev && vals[3] !== prev[3];
    el.innerHTML = vals.map(function(v, i){
      var sep = i < vals.length - 1 ? '<span class="sep">:</span>' : '';
      var cls = (i === 3 && changed) ? "digit tick" : "digit";
      return '<span class="' + cls + '">' + v + '</span>' + sep;
    }).join("");
    prev = vals;
  }

  function tick(){
    var now = new Date();
    var diff = target - now;

    if (diff <= 0){
      field.remove();
      clearInterval(timer);
      return;
    }

    var d = Math.floor(diff / 86400000);
    var h = Math.floor((diff % 86400000) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    render(d, h, m, s);
  }

  tick();
  var timer = setInterval(tick, 1000);
</script>

</body>
</html>
